version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: interfacehive_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interfacehive}
      POSTGRES_USER: ${POSTGRES_USER:-interfacehive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interfacehive_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: interfacehive_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: ${DOCKERHUB_USERNAME}/interfacehive-backend:latest
    container_name: interfacehive_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - backend
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-interfacehive_user}:${POSTGRES_PASSWORD:-interfacehive_dev_password}@postgres:5432/${POSTGRES_DB:-interfacehive}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
      - DEBUG=False
      - USE_HTTPS=${USE_HTTPS:-False}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media

  frontend:
    image: ${DOCKERHUB_USERNAME}/interfacehive-frontend:latest
    container_name: interfacehive_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
