name: Deploy to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/interfacehive-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/interfacehive-frontend:latest
        build-args: |
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Create directory if it doesn't exist and navigate into it
          mkdir -p ~/InterfaceHive
          cd ~/InterfaceHive
          
          # Initialize git repo if not already done
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/${{ github.repository }}.git
          fi
          
          # Fetch and pull latest code
          git fetch origin
          git reset --hard origin/master
          
          # Create/update .env file with production secrets
          cat > .env << EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_DB=interfacehive
          POSTGRES_USER=interfacehive_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS || secrets.EC2_HOST }},localhost,127.0.0.1
          REDIS_URL=redis://redis:6379/0
          EOF
          
          # Pull latest images
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interfacehive-backend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interfacehive-frontend:latest
          
          # Stop existing containers
          docker-compose -f docker-compose.prod.yml down
          
          # Start services with latest images
          docker-compose -f docker-compose.prod.yml up -d
          
          # Wait for backend to be ready
          sleep 10
          
          # Run migrations
          docker-compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput || echo "Migrations skipped or failed"
          
          # Collect static files
          docker-compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput || echo "Static files collection skipped or failed"
          
          # Check status
          docker-compose -f docker-compose.prod.yml ps
